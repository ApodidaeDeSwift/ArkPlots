# Build the Windows installer and attach it to an APP_Ver* GitHub Release.
# GitHub does not package binaries from source by itself; this workflow does.
#
# Typical flow:
#   1. Bump VERSION in app_info.py (must match the tag)
#   2. Commit and push
#   3. Create tag APP_Ver… on APP_Release (or publish a Release with that tag)
#   4. This job uploads Arkplot_setup_ver{VERSION}.exe onto that Release
name: APP release installer

on:
  push:
    tags:
      - "APP_Ver*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional APP_Ver* tag to attach the built exe onto (leave empty to only produce an artifact)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows-exe:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref_name, 'APP_Ver') ||
      startsWith(github.event.release.tag_name, 'APP_Ver')
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require APP_Release packaging tree
        shell: bash
        run: |
          if [ ! -f packaging/build_release.py ]; then
            echo "::error::This tag/commit is not the desktop packaging branch (APP_Release)."
            echo "APP_Ver* releases must be created from APP_Release, not main."
            echo "main still contains the old committed Arkplot_ver1.0.4.exe — do not ship that file."
            exit 1
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          # Latest PyInstaller bootloader tends to attract fewer stale AV signatures.
          python -m pip install -r requirements.txt "pyinstaller>=6.11" pythonnet pillow

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Verify tag matches app_info.VERSION
        if: env.RELEASE_TAG != '' && startsWith(env.RELEASE_TAG, 'APP_Ver')
        shell: python
        run: |
          import os
          import sys
          sys.path.insert(0, os.getcwd())
          from app_info import VERSION, app_ver_tag
          tag = os.environ.get("RELEASE_TAG", "")
          expected = app_ver_tag()
          if tag != expected:
              raise SystemExit(
                  f"Tag {tag!r} does not match app_info.py ({expected!r}). "
                  f"Bump VERSION to match the tag before releasing."
              )
          print(f"tag {tag} matches VERSION {VERSION}")

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Note: `secrets` cannot be used in step `if:` expressions; check inside the script.
      - name: Prepare code-signing certificate
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_PFX_BASE64)) {
            Write-Host "No SIGN_PFX_BASE64 secret; skipping code signing."
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:SIGN_PFX_BASE64)
          $path = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          "SIGN_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:SIGN_PFX_PASSWORD) {
            "SIGN_PFX_PASSWORD=$env:SIGN_PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          Write-Host "Code-signing certificate prepared."

      - name: Build installer
        run: python packaging/build_release.py

      - name: Upload installer to GitHub Release
        if: startsWith(env.RELEASE_TAG, 'APP_Ver')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: Arkplot_setup_ver*.exe
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Upload installer artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ArkPlots-setup
          path: Arkplot_setup_ver*.exe
          if-no-files-found: error
